<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
<script>
const decryptPayload = async function decryptPayload(p, password) {
  const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const subtle = crypto.subtle;
  const base = await subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await subtle.deriveKey({ name: 'PBKDF2', salt: u8(p.salt), iterations: p.iter, hash: 'SHA-256' }, base,
    { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await subtle.decrypt({ name: 'AES-GCM', iv: u8(p.iv) }, key, u8(p.ct));
  return new TextDecoder().decode(pt);
};
const KEY = 'slotnote.pw';
const P = JSON.parse(document.getElementById('payload').textContent);
const store = { get(){ try { return localStorage.getItem(KEY); } catch(e) { return null; } },
  set(v){ try { localStorage.setItem(KEY, v); } catch(e) {} }, del(){ try { localStorage.removeItem(KEY); } catch(e) {} } };
function show(html){ document.open(); document.write(html); document.close(); }
async function tryOpen(pw, keep){
  const html = await decryptPayload(P, pw);
  if (keep) store.set(pw);
  show(html);
}
const f = document.getElementById('f'), go = document.getElementById('go'), err = document.getElementById('err');
f.addEventListener('submit', async e => {
  e.preventDefault(); go.disabled = true; err.textContent = ''; go.textContent = '確認中…';
  try { await tryOpen(document.getElementById('pw').value, document.getElementById('keep').checked); }
  catch (x) { err.textContent = 'パスワードが違います'; go.disabled = false; go.textContent = '開く'; }
});
const saved = store.get();
if (saved) { f.style.visibility = 'hidden'; tryOpen(saved, false).catch(() => { store.del(); f.style.visibility = ''; }); }
</script></body></html>
